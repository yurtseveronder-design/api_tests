[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers -m "not rate_limit"
log_cli = false
markers =
    unit: offline tests of the framework itself (local stub server)
    external: tests against the public JSONPlaceholder API
    sentinel: tests against a running ai-sentinel gateway
    rate_limit: destructive rate-limit test; needs a freshly started gateway (run with -m rate_limit)
