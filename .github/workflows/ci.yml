name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AI_SENTINEL_API_KEY: test-api-key
      SENTINEL_API_KEY: test-api-key
      SENTINEL_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Security scan (Bandit)
        run: |
          pip install bandit
          bandit -r framework schemas -ll

      - name: Check out the rest of the stack
        uses: actions/checkout@v4
        with:
          repository: yurtseveronder-design/ai-sentinel
          path: .sut/ai-sentinel
      - uses: actions/checkout@v4
        with:
          repository: yurtseveronder-design/sentinel-semantic
          path: .sut/sentinel-semantic
      - uses: actions/checkout@v4
        with:
          repository: yurtseveronder-design/sentinel-ui
          path: .sut/sentinel-ui

      - name: Install the stack
        run: |
          pip install -e .sut/ai-sentinel -e .sut/sentinel-semantic
          pip install fastapi uvicorn pydantic

      - name: Start sentinel-semantic, ai-sentinel and sentinel-ui
        run: scripts/stack.sh start

      - name: Run test suite with coverage
        run: >
          python -m pytest -v
          --cov=framework --cov-report=term-missing --cov-report=xml --cov-fail-under=80
          --html=reports/report.html --self-contained-html
          --alluredir=reports/allure-results

      - name: Restart gateway for the rate-limit test
        if: always()
        run: |
          scripts/stack.sh restart-gateway
          python -m pytest -v -m rate_limit

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            reports/
            coverage.xml
            .stack/*.log

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image and run offline tests inside it
        run: |
          docker build -t api-tests .
          docker run --rm api-tests python -m pytest -q -m unit
